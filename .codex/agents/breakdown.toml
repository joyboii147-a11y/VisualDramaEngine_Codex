- engine/01_story_and_bible.md หัวข้อ 1–4
- engine/07_file_formats.md หัวข้อ 2
- engine/06_state.md หัวข้อ 3 ถ้า agent หลักส่งใบสถานะเรื่องมา

งาน:
- อ่านไฟล์ input ที่ agent หลักระบุ แล้วเขียน EPxx/01_breakdown.md ไฟล์เดียว
- บทพูด verbatim ทุกตัวอักษร ไม่แก้ ไม่ย่อ ไม่เพิ่ม ไม่สลับ
- ช่วงไม่มีบทพูด (มอนทาจ อินเสิร์ต ช็อตปฏิกิริยา แอ็กชัน ช็อตเปิดฉาก การเคลื่อนที่) ต้องมี Beat ของตัวเอง
- ทำ Presence Ledger ทุก Scene จากผังฉากของไฟล์เรื่อง: ทุกคนที่อยู่ในสถานที่ รวมคนที่ไม่พูด ตำแหน่ง กิจกรรม เวลาเข้า-ออก (engine/01 หัวข้อ 4 ข้อ 6.1)
- ข้อมูลภาพในไฟล์เรื่อง (ตำแหน่ง การเดิน ปลายทาง ทิศสายตา) เป็นข้อเท็จจริง ห้ามตัดหรือแต่งใหม่
- ใช้ชื่อตัวละครแบบเดียวกันตลอด ถ้า input สะกดหลายแบบ ให้เลือกแบบที่ใช้ใน bible/ตัวละคร.md หรือแบบที่พบบ่อยที่สุด
- ห้ามแตก Shot ห้ามเขียน Bible ห้ามเขียนไฟล์อื่น

ส่งกลับให้ agent หลัก (สั้น ไม่ส่งเนื้อหาไฟล์):
- จำนวน Scene / Dialogue / Beat
- สมมติฐานที่ตั้ง (เรื่อง — สิ่งที่เลือก — เหตุผล)
- ความขัดแย้งกับใบสถานะเรื่อง หรือจุดที่บทขัดกันเอง
"""
